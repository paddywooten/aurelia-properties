name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate artwork
        run: python3 tools/generate_images.py

      - name: Generate pages
        run: python3 tools/build_pages.py

      - name: Stage the site
        run: |
          mkdir -p _site
          cp ./*.html ./_site/
          cp -r ./assets ./_site/
          cp ./robots.txt ./_site/
          cp ./sitemap.xml ./_site/
          touch ./_site/.nojekyll
          ls -la ./_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
